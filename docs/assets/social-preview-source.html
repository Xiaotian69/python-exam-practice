<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>Python Exam Practice social preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        width: 100%;
      }

      body {
        background: #07171d;
        color: #f4fbff;
      }

      .canvas {
        background:
          radial-gradient(circle at 6% 6%, rgba(255, 211, 67, 0.28), transparent 27%),
          linear-gradient(112deg, rgba(55, 118, 171, 0.24), transparent 44%);
        display: grid;
        grid-template-columns: 555px 1fr;
        height: 640px;
        overflow: hidden;
        padding: 68px 62px;
        position: relative;
        width: 1280px;
      }

      .canvas::before {
        background-image:
          linear-gradient(rgba(113, 195, 201, 0.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(113, 195, 201, 0.075) 1px, transparent 1px);
        background-size: 30px 30px;
        content: "";
        inset: 0;
        mask-image: linear-gradient(90deg, black, transparent 70%);
        position: absolute;
      }

      .copy {
        align-self: center;
        position: relative;
        z-index: 2;
      }

      .kicker {
        color: #ffd343;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.17em;
        margin: 0 0 24px;
      }

      h1 {
        font-size: 58px;
        letter-spacing: -0.05em;
        line-height: 1.02;
        margin: 0;
      }

      .count {
        color: #bce7ff;
        font-size: 27px;
        font-weight: 750;
        margin: 30px 0 16px;
      }

      .features {
        color: #a9c5ce;
        font-size: 16px;
        line-height: 1.45;
        margin: 0;
        max-width: 470px;
      }

      .accent {
        background: linear-gradient(90deg, #3776ab 0 54%, #ffd343 54%);
        border-radius: 999px;
        height: 10px;
        margin-top: 36px;
        width: 158px;
      }

      .product {
        align-self: center;
        filter: drop-shadow(0 28px 38px rgba(0, 0, 0, 0.56));
        height: 468px;
        margin-left: 38px;
        overflow: hidden;
        position: relative;
        transform: rotate(2deg);
        width: 720px;
        z-index: 2;
      }

      .window {
        background: #061317;
        border: 1px solid rgba(140, 232, 224, 0.32);
        border-radius: 20px;
        height: 100%;
        overflow: hidden;
      }

      .chrome {
        align-items: center;
        background: #0b252a;
        border-bottom: 1px solid rgba(140, 232, 224, 0.18);
        display: flex;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
      }

      .chrome span {
        background: rgba(255, 255, 255, 0.28);
        border-radius: 50%;
        height: 8px;
        width: 8px;
      }

      .chrome span:first-child { background: #ffd343; }
      .chrome span:nth-child(2) { background: #3776ab; }

      img {
        display: block;
        height: calc(100% - 40px);
        object-fit: cover;
        object-position: top left;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="copy">
        <p class="kicker">PYTHON EXAM PRACTICE</p>
        <h1>Exam practice,<br>inside the browser.</h1>
        <p class="count">151 questions. One browser tab.</p>
        <p class="features">Objective questions · Code exercises · Progress tracking.</p>
        <div class="accent" aria-hidden="true"></div>
      </section>
      <section class="product" aria-label="Product screenshot">
        <div class="window">
          <div class="chrome"><span></span><span></span><span></span></div>
          <img src="./screenshots/question.png" alt="Python Exam Practice interface">
        </div>
      </section>
    </main>
  </body>
</html>
